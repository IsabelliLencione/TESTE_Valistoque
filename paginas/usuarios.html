<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/produtos.css">
</head>

<body>
    <nav class="nav">
        <div class="header-nav">Valistoque</div>
        <ul>
            <li><a href="relatorio.html">Relatório</a></li>
            <li><a href="produtos.php">Cadastro Produtos</a></li>
            <li><a href="usuarios.html">Cadastro Usuários</a></li>
            <li><a href="prateleira.php">Prateleiras</a></li>
            <li><a href="estoque.php">Estoque Central</a></li>
            <li><a href="alertas.php">Alertas</a></li>
            <li><a href="ListaUsuarios.php">Usuários</a></li>
            <li style="margin-top: auto; border-top: 1px solid #34495e;">
                <a href="perfil.php">Perfil</a>
            </li>
        </ul>
    </nav>
    <main>
        <!-- CADASTRO DOS USUÁRIOS -->
        <div id="secao-produto">
            <h1 id="titulo-cadastro-produto">Cadastro de Usuário</h1>

            <form id="formCadastroUsuario" class="produto">
                <div>
                    <label for="nome">Nome Completo:</label>
                    <input type="text" id="nome" name="nome" required>
                </div>
                <div>
                    <label for="email">E-mail corporativo:</label>
                    <input type="email" id="email" name="email" required>
                </div>
                <div>
                    <label for="cpf">CPF:</label>
                    <input type="text" id="cpf" name="cpf" placeholder="111.111.111-11" required>
                </div>
                <div>
                    <label for="senha">Senha:</label>
                    <input type="password" id="senha" name="senha" required>
                </div>
                <div>
                    <label for="tipo">Tipo de Perfil:</label>
                    <select id="tipo" name="tipo" required
                        style="width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 4px; box-sizing: border-box;">
                        <option value="funcionario">Funcionário</option>
                        <option value="administrador">Administrador</option>
                    </select>
                </div>

                <!-- Div para exibir alertas de erro ou sucesso -->
                <div id="mensagem-status"
                    style="margin-top: 15px; font-weight: bold; text-align: center; display: none;"></div>

                <button type="submit" class="btn-cadastrar">Salvar Usuário</button>
            </form>
        </div>
    </main>

    <script>
        document.getElementById('formCadastroUsuario').addEventListener('submit', async function (e) {
            e.preventDefault();

            const statusDiv = document.getElementById('mensagem-status');
            statusDiv.style.display = 'none';
            statusDiv.innerText = '';

            const formData = new FormData(this);

            try {
                // Envia os dados para o arquivo cadastro.php que criamos anteriormente
                const response = await fetch('cadastro.php', {
                    method: 'POST',
                    body: formData
                });

                const resultado = await response.json();

                if (resultado.sucesso) {
                    statusDiv.style.color = '#28a745';
                    statusDiv.innerText = resultado.mensagem;
                    statusDiv.style.display = 'block';

                    // Limpa o formulário após o sucesso
                    document.getElementById('formCadastroUsuario').reset();
                } else {
                    statusDiv.style.color = '#e74c3c';
                    statusDiv.innerText = resultado.mensagem;
                    statusDiv.style.display = 'block';
                }
            } catch (error) {
                statusDiv.style.color = '#e74c3c';
                statusDiv.innerText = 'Falha ao conectar-se ao servidor de cadastro.';
                statusDiv.style.display = 'block';
            }
        });
    </script>
</body>

</html>
