<main>
<!-- SECÇÃO PERFIL (BLOCO COMPLETO E UNIFICADO) -->
<div id="secao-perfil">
    <div class="container">

        <!-- Topo: Foto e Título -->
        <div class="profile-header">
            <div class="avatar-wrapper" onclick="triggerSelectFile()">
                <img id="profile-img" src="https://via.placeholder.com/150" alt="Foto de Perfil">
                <div class="avatar-overlay">
                    <span>ADICIONAR</span>
                </div>
            </div>
            <input type="file" id="file-input" accept="image/*" onchange="previewImage(event)" style="display: none;">

            <h2 id="titulo-perfil-admin">Perfil do Administrador</h2>
        </div>

        <form id="profile-form" onsubmit="saveProfile(event)">
            <!-- Campo Nome -->
            <div class="info-group">
                <label class="label" for="user-name">Nome do usuário:</label>
                <input type="text" id="user-name" class="input-field" value="Administrador Valistoque" readonly required>
            </div>

            <!-- Campo E-mail -->
            <div class="info-group">
                <label class="label" for="user-email">Email do usuário:</label>
                <input type="email" id="user-email" class="input-field" value="admin@valistoque.com" readonly required>
            </div>

            <!-- Campo Tipo de Conta -->
            <div class="info-group">
                <span class="label">Tipo de conta:</span>
                <div class="input-field disabled-field">
                    <span class="badge" id="badge-perfil">Administrador</span>
                </div>
            </div>

            <!-- Botões organizados -->
            <div class="button-group">
                <a href="Principal.html" class="btn-exit">
                    Sair para a tela principal
                </a>
            </div>
        </form>

    </div>
<script type="module" src="../js/perfil.js"></script>
</main>
</body>
